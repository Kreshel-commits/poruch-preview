name: Publish verified Poruch injury language (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-injury-language-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-1b64-81f4-8b7e-63332eba7fcc/raw?se=2026-10-15T18%3A39%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=90334351-f4ba-5858-8601-2b2b7aeb2bf9&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T04%3A18%3A32Z&ske=2026-10-16T04%3A18%3A32Z&sks=b&skv=2026-02-06&sig=feOXZfiJC7bdIDL/4Tz/H/Zx/Trg5pnX/LVu3GbjG0I%3D"
      VERIFIED_SHA: "cb199422aa792331a9e727a3139ebc02f9d6e6dd"
      ZIP_SHA256: "9836a9b54fdfbcf4ccfece49f4ce8dd20c4e2c16043cff609cc4942853b2ebec"
      EXPECTED_PARENT: "013af5e1cf22deb464d5e2ce6c8ffc299b96bcf6"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Verify released build and unpack safe website
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import os,urllib.request,pathlib,hashlib,zipfile,json,shutil
          p=pathlib.Path('/tmp/poruch-injury-phrasing.zip')
          req=urllib.request.Request(os.environ['ARTIFACT_URL'],headers={'User-Agent':'Poruch-GitHub-Pages-Publisher'})
          with urllib.request.urlopen(req, timeout=120) as r, p.open('wb') as f: shutil.copyfileobj(r,f)
          if hashlib.sha256(p.read_bytes()).hexdigest()!=os.environ['ZIP_SHA256']:
              raise RuntimeError('Build archive SHA-256 mismatch')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              if len(names)<100 or len(names)!=len(set(names)): raise RuntimeError('Unexpected site file inventory')
              info=json.loads(z.read('build-info.json'))
              if info.get('sourceCommit')!=os.environ['VERIFIED_SHA'] or info.get('releaseBranch')!='release/web-preview':
                  raise RuntimeError('Build does not match merged release commit')
              manifest=json.loads(z.read('manifest.webmanifest'))
              if manifest.get('scope')!='/poruch-preview/': raise RuntimeError('Unexpected PWA scope')
              for item in z.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts or '.github' in path.parts:
                      raise RuntimeError('Unsafe ZIP member')
                  if item.is_dir(): continue
                  dest=pathlib.Path.cwd().joinpath(*path.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(item) as src,dest.open('wb') as out: shutil.copyfileobj(src,out)
          print('Verified source commit, digest, manifest and extracted site')
          PY
      - name: Commit website and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f '.github/workflows/publish-injury-language-once.yml'
          git add -A
          git commit -m "Publish plain-language injury pathway from source cb199422"
          git push origin HEAD:main
