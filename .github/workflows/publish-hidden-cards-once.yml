name: Publish verified Poruch hidden-cards UI (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hidden-cards-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-453c-81f5-b22b-3730eb31faf7/raw?se=2026-10-13T18%3A34%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=65579544-cdfb-5c86-986d-5c57a456b11d&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T22%3A35%3A09Z&ske=2026-10-13T22%3A35%3A09Z&sks=b&skv=2026-02-06&sig=nI7DabtBIl4K86O9tiO2AdcKzCj2ea2tBthMAHWYOR0%3D"
      VERIFIED_SHA: "90982832dc42e957abe0c4f96021a6d347d47e99"
      ZIP_SHA256: "d47d4ed398e2d5033b9e046aa96004fd0f823634a1a14276fe515ab3fdd0a2d1"
      EXPECTED_PARENT: "b484eebe7bf52af574acb5988bdabc9c334b237a"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Verify verified release and safely unpack site
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import os,urllib.request,pathlib,hashlib,zipfile,json,shutil
          p=pathlib.Path('/tmp/poruch-web-release.zip')
          req=urllib.request.Request(os.environ['ARTIFACT_URL'],headers={'User-Agent':'Poruch-GitHub-Pages-Publisher'})
          with urllib.request.urlopen(req, timeout=120) as r, p.open('wb') as f: shutil.copyfileobj(r,f)
          if hashlib.sha256(p.read_bytes()).hexdigest()!=os.environ['ZIP_SHA256']:
              raise RuntimeError('Compiled ZIP digest mismatch')
          with zipfile.ZipFile(p) as z:
              files=z.namelist()
              if len(files)<100 or len(files)!=len(set(files)): raise RuntimeError('Unexpected release file inventory')
              info=json.loads(z.read('build-info.json'))
              if info.get('sourceCommit')!=os.environ['VERIFIED_SHA'] or info.get('releaseBranch')!='release/web-preview':
                  raise RuntimeError('Unexpected compiled source SHA')
              manifest=json.loads(z.read('manifest.webmanifest'))
              if manifest.get('scope')!='/poruch-preview/': raise RuntimeError('Wrong site PWA scope')
              for item in z.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts or '.github' in path.parts:
                      raise RuntimeError('Unsafe ZIP member')
                  if item.is_dir(): continue
                  dest=pathlib.Path.cwd().joinpath(*path.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(item) as src,dest.open('wb') as out: shutil.copyfileobj(src,out)
          print('Verified Pages build source SHA, scope, ZIP integrity; extracted only compiled site')
          PY
      - name: Commit exact site and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f '.github/workflows/publish-hidden-cards-once.yml'
          git add -A
          git commit -m "Publish hidden-cards banner dismissal from source 90982832"
          git push origin HEAD:main
